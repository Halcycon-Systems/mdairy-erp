name: Bug Report
description: Report something that is broken or not working as expected
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to file a bug report. Please fill in as much detail as possible — the more information you provide, the faster we can fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what is wrong.
      placeholder: "When I do X, Y happens instead of Z."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps to reproduce the issue.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What actually happened?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      description: Which part of the system is affected?
      options:
        - mdairy_base (Farmer records, Cooperatives)
        - mdairy_collection (Milk collection, Quality tests)
        - mdairy_finance (Payout batches, Deductions)
        - mdairy_mpesa (MPESA B2C integration)
        - mdairy_sms (SMS notifications)
        - Next.js frontend
        - Docker / Infrastructure
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please provide:
        - OS and version
        - Docker version (`docker --version`)
        - Node.js version (`node --version`) if frontend-related
        - Browser and version if UI-related
      placeholder: |
        OS: Ubuntu 22.04
        Docker: 24.0.5
        Node.js: 20.10.0
        Browser: Chrome 120
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: |
        Paste any error messages, stack traces, or logs. Redact any sensitive data (API keys, passwords, phone numbers).
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have searched for existing issues and this is not a duplicate
          required: true
        - label: I have removed any sensitive data (API keys, passwords, phone numbers) from logs
          required: true
